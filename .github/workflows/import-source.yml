name: Import verified VELA source
on:
  push:
    paths: [".github/workflows/import-source.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Unpack reviewed source and commit
        run: |
          unzip -o vela-source.zip
          rm vela-source.zip .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import complete VELA storefront source"
          git push
